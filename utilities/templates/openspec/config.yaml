# openspec/config.yaml
# Configuración global del marco OpenSpec para el proyecto

schema: spec-driven

context: |
  Architecture: Multi-agent Spec-Driven Development (forgeAB)
  Coding Standard: Clean code, strict separation of concerns, 100% test-first
  Security: Zero unhandled exceptions, zero leaks of credentials/tokens, automated CVE auditing
  Quality Target: CRAP score < 30 on all functions (CRAP = CC^2 * (1 - Cov)^3 + CC)

rules:
  proposal:
    - Clearly define the problem, user motivation, and technical scope
    - List non-goals and explicit boundaries to prevent scope creep
    - Identify affected modules, dependencies, and rollback plan
  specs:
    - Use Delta Specs format (## ADDED Requirements, ## MODIFIED Requirements, ## REMOVED Requirements)
    - Formulate clear requirements using RFC 2119 keywords (SHALL, MUST, SHOULD)
    - Every requirement MUST include at least one concrete scenario with WHEN / THEN steps
  design:
    - Detail technical components, interfaces, and state management
    - Reference architectural Mermaid diagrams located in diagrams/
    - Document technical decisions, alternatives considered, and trade-offs
    - Include error handling, logging policies, and complexity mitigation
  tasks:
    - Structure tasks hierarchically with numbered checkpoints (1.1, 1.2, 2.1...)
    - Strictly enforce Test-First order: Trapper test definitions before production code
    - Include validation checkpoints for tests, security audits, and CRAP compliance
